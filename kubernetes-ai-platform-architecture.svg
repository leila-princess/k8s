<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0B1F33" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#21364A"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1479C9"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 18px; fill: #D8E9F8; }
      .layer { font-size: 23px; font-weight: 700; fill: #17324A; }
      .boxTitle { font-size: 22px; font-weight: 700; fill: #17324A; }
      .boxText { font-size: 16px; fill: #344B5E; }
      .miniTitle { font-size: 18px; font-weight: 700; fill: #17324A; }
      .miniText { font-size: 14px; fill: #42596B; }
      .flow { fill: none; stroke: #21364A; stroke-width: 3; marker-end: url(#arrow); }
      .flowBlue { fill: none; stroke: #1479C9; stroke-width: 4; marker-end: url(#arrowBlue); }
      .observe { fill: none; stroke: #E4872D; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F6F9FC"/>
  <rect x="0" y="0" width="1920" height="112" fill="#0B4F93"/>
  <rect x="0" y="105" width="1920" height="7" fill="#2CB7D7"/>
  <text x="72" y="60" class="cn title">基于 Kubernetes 的智能算力服务化平台</text>
  <text x="74" y="91" class="cn subtitle">镜像标准化 · GitOps 自动交付 · 多租户资源隔离 · 统一流量治理 · 全栈可观测</text>
  <g transform="translate(1715,30)">
    <rect width="142" height="52" rx="10" fill="#FFFFFF" opacity="0.16"/>
    <text x="71" y="33" text-anchor="middle" class="cn" font-size="19" font-weight="700" fill="#FFFFFF">目标态架构</text>
  </g>

  <!-- left layer labels -->
  <g class="cn">
    <rect x="36" y="145" width="128" height="102" rx="16" fill="#D8EDF9"/><text x="100" y="203" text-anchor="middle" class="layer">访问层</text>
    <rect x="36" y="270" width="128" height="245" rx="16" fill="#E8E2F6"/><text x="100" y="400" text-anchor="middle" class="layer">平台控制层</text>
    <rect x="36" y="538" width="128" height="139" rx="16" fill="#E2F2EA"/><text x="100" y="614" text-anchor="middle" class="layer">交付链路</text>
    <rect x="36" y="700" width="128" height="284" rx="16" fill="#FFF0DC"/><text x="100" y="848" text-anchor="middle" class="layer">运行与观测层</text>
  </g>

  <!-- access -->
  <g filter="url(#shadow)" class="cn">
    <rect x="360" y="145" width="300" height="102" rx="18" fill="#FFFFFF" stroke="#7BAFD0" stroke-width="2"/>
    <circle cx="415" cy="196" r="25" fill="#D8EDF9"/><path d="M406 193a9 9 0 1 1 18 0v5h5v14h-28v-14h5z" fill="#1479C9"/>
    <text x="535" y="204" text-anchor="middle" class="boxTitle">平台用户 / 租户</text>
    <rect x="940" y="145" width="420" height="102" rx="18" fill="#FFFFFF" stroke="#7BAFD0" stroke-width="2"/>
    <text x="1150" y="184" text-anchor="middle" class="boxTitle">统一访问入口</text>
    <text x="1150" y="216" text-anchor="middle" class="boxText">Ingress Controller · HTTPS / 域名 / 路径路由</text>
  </g>
  <path d="M660 196 H930" class="flowBlue"/>

  <!-- platform control plane -->
  <g class="cn" filter="url(#shadow)">
    <rect x="205" y="270" width="1614" height="245" rx="22" fill="#FFFFFF" stroke="#9D8BC2" stroke-width="2"/>
    <rect x="205" y="270" width="1614" height="48" rx="22" fill="#E8E2F6"/><rect x="205" y="296" width="1614" height="22" fill="#E8E2F6"/>
    <text x="239" y="302" class="boxTitle">Go 平台控制面（REST API + client-go）</text>

    <rect x="239" y="343" width="425" height="134" rx="16" fill="#F4F0FB" stroke="#8C70BF" stroke-width="2"/>
    <text x="451" y="376" text-anchor="middle" class="miniTitle">双层身份与租户授权</text>
    <text x="451" y="407" text-anchor="middle" class="boxText">JWT + Redis → 租户身份</text>
    <text x="451" y="435" text-anchor="middle" class="boxText">租户 → Namespace + ServiceAccount</text>
    <text x="451" y="461" text-anchor="middle" class="miniText">RoleBinding → Role → API Server RBAC 判定</text>

    <rect x="692" y="343" width="535" height="134" rx="16" fill="#EEF7FD" stroke="#4B9BD3" stroke-width="2"/>
    <text x="959" y="376" text-anchor="middle" class="miniTitle">模型环境标准化与镜像构建</text>
    <text x="959" y="407" text-anchor="middle" class="boxText">基础镜像：Python / PyTorch / TensorFlow / CUDA</text>
    <text x="959" y="435" text-anchor="middle" class="boxText">代码压缩包 → src/ + 动态 Dockerfile → tar 流</text>
    <text x="959" y="461" text-anchor="middle" class="miniText">Docker ImageBuild → 专属镜像 → 租户 Harbor 项目</text>

    <rect x="1255" y="343" width="530" height="134" rx="16" fill="#F1F8F4" stroke="#65A985" stroke-width="2"/>
    <text x="1520" y="376" text-anchor="middle" class="miniTitle">Kubernetes 编排与声明式交付</text>
    <text x="1520" y="407" text-anchor="middle" class="boxText">Deployment：镜像 / 启动命令 / 端口 / CPU / 内存 / GPU</text>
    <text x="1520" y="435" text-anchor="middle" class="boxText">Namespace · Quota · LimitRange · ServiceAccount / RBAC</text>
    <text x="1520" y="461" text-anchor="middle" class="miniText">Service / Ingress · Git 仓库 · Argo CD 同步</text>
  </g>
  <path d="M510 247 V260 H379 V333" class="flow"/><text x="420" y="260" class="cn miniText">① 登录 / 创建服务</text>

  <!-- delivery -->
  <g class="cn" filter="url(#shadow)">
    <rect x="205" y="538" width="294" height="139" rx="18" fill="#FFFFFF" stroke="#65A985" stroke-width="2"/>
    <text x="352" y="573" text-anchor="middle" class="miniTitle">模型代码压缩包</text><text x="352" y="605" text-anchor="middle" class="boxText">.zip / .tar / .tar.gz / .tgz</text><text x="352" y="636" text-anchor="middle" class="miniText">模型代码 · 依赖文件 · 启动脚本</text>
    <rect x="565" y="538" width="271" height="139" rx="18" fill="#FFFFFF" stroke="#65A985" stroke-width="2"/>
    <text x="700" y="573" text-anchor="middle" class="miniTitle">Docker 构建上下文</text><text x="700" y="605" text-anchor="middle" class="boxText">tmpDir / Dockerfile + src/</text><text x="700" y="636" text-anchor="middle" class="miniText">打包 tar.Reader → ImageBuild</text>
    <rect x="902" y="538" width="238" height="139" rx="18" fill="#FFFFFF" stroke="#65A985" stroke-width="2"/>
    <text x="1021" y="573" text-anchor="middle" class="miniTitle">Harbor</text><text x="1021" y="605" text-anchor="middle" class="boxText">私有镜像仓库</text><text x="1021" y="636" text-anchor="middle" class="miniText">Tag / 版本 / 制品交付</text>
    <rect x="1206" y="538" width="242" height="139" rx="18" fill="#FFFFFF" stroke="#65A985" stroke-width="2"/>
    <text x="1327" y="573" text-anchor="middle" class="miniTitle">Git 配置仓库</text><text x="1327" y="605" text-anchor="middle" class="boxText">租户化 YAML 清单</text><text x="1327" y="636" text-anchor="middle" class="miniText">唯一事实源 · 可审计回滚</text>
    <rect x="1514" y="538" width="305" height="139" rx="18" fill="#FFFFFF" stroke="#65A985" stroke-width="2"/>
    <text x="1666" y="573" text-anchor="middle" class="miniTitle">Argo CD ApplicationSet</text><text x="1666" y="605" text-anchor="middle" class="boxText">按租户生成 Application</text><text x="1666" y="636" text-anchor="middle" class="miniText">自动同步 · 漂移修复 · 回滚</text>
  </g>
  <path d="M499 608 H555" class="flow"/><path d="M836 608 H892" class="flow"/><path d="M1140 608 H1196" class="flow"/><path d="M1448 608 H1504" class="flow"/>
  <text x="701" y="526" text-anchor="middle" class="cn miniText">② 构建</text><text x="1021" y="526" text-anchor="middle" class="cn miniText">③ 推送镜像</text><text x="1327" y="526" text-anchor="middle" class="cn miniText">④ 写入声明</text><text x="1666" y="526" text-anchor="middle" class="cn miniText">⑤ 持续同步</text>

  <!-- runtime -->
  <g class="cn" filter="url(#shadow)">
    <rect x="205" y="700" width="1188" height="284" rx="22" fill="#FFFFFF" stroke="#D99B51" stroke-width="2"/>
    <text x="239" y="740" class="boxTitle">Kubernetes 智能算力集群</text>
    <rect x="239" y="761" width="548" height="184" rx="18" fill="#FFF7EC" stroke="#E3AE6D" stroke-width="2"/>
    <rect x="255" y="777" width="516" height="36" rx="10" fill="#F7D8AB"/>
    <text x="513" y="802" text-anchor="middle" class="miniTitle">Tenant A Namespace</text>
    <text x="273" y="843" class="miniText">🔐 ServiceAccount + RoleBinding</text><text x="273" y="873" class="miniText">📊 ResourceQuota + LimitRange</text><text x="273" y="903" class="miniText">⚙ Deployment / Pod</text>
    <rect x="551" y="832" width="196" height="83" rx="13" fill="#FFFFFF" stroke="#E3AE6D"/>
    <text x="649" y="864" text-anchor="middle" class="miniTitle">推理服务 A</text><text x="649" y="892" text-anchor="middle" class="miniText">CPU / GPU · Service</text>

    <rect x="811" y="761" width="548" height="184" rx="18" fill="#FFF7EC" stroke="#E3AE6D" stroke-width="2"/>
    <rect x="827" y="777" width="516" height="36" rx="10" fill="#F7D8AB"/>
    <text x="1085" y="802" text-anchor="middle" class="miniTitle">Tenant B Namespace</text>
    <text x="845" y="843" class="miniText">🔐 ServiceAccount + RoleBinding</text><text x="845" y="873" class="miniText">📊 ResourceQuota + LimitRange</text><text x="845" y="903" class="miniText">⚙ Deployment / Pod</text>
    <rect x="1123" y="832" width="196" height="83" rx="13" fill="#FFFFFF" stroke="#E3AE6D"/>
    <text x="1221" y="864" text-anchor="middle" class="miniTitle">推理服务 B</text><text x="1221" y="892" text-anchor="middle" class="miniText">CPU / GPU · Service</text>
  </g>
  <path d="M1666 677 V718 H1398" class="flow"/>

  <!-- observability -->
  <g class="cn" filter="url(#shadow)">
    <rect x="1423" y="700" width="396" height="284" rx="22" fill="#FFFFFF" stroke="#E4872D" stroke-width="2"/>
    <text x="1457" y="740" class="boxTitle">可观测与告警中心</text>
    <rect x="1457" y="765" width="328" height="66" rx="14" fill="#FFF1E3"/><text x="1621" y="793" text-anchor="middle" class="miniTitle">Prometheus</text><text x="1621" y="817" text-anchor="middle" class="miniText">集群 / 服务 / 推理指标采集</text>
    <rect x="1457" y="846" width="158" height="91" rx="14" fill="#FFF1E3"/><text x="1536" y="880" text-anchor="middle" class="miniTitle">Grafana</text><text x="1536" y="910" text-anchor="middle" class="miniText">多租户看板</text>
    <rect x="1627" y="846" width="158" height="91" rx="14" fill="#FFF1E3"/><text x="1706" y="880" text-anchor="middle" class="miniTitle">Alert Rules</text><text x="1706" y="905" text-anchor="middle" class="miniText">资源 / 延迟</text><text x="1706" y="926" text-anchor="middle" class="miniText">流量 / 异常</text>
  </g>
  <path d="M1393 877 H1413" class="observe"/><text x="1401" y="860" text-anchor="end" class="cn miniText" fill="#B65D13">⑦ Metrics</text>
  <path d="M1706 846 V817" class="observe"/>

  <!-- security strip and footer -->
  <rect x="205" y="1006" width="1614" height="48" rx="14" fill="#17324A"/>
  <text x="1012" y="1038" text-anchor="middle" class="cn" font-size="18" font-weight="700" fill="#FFFFFF">双层安全体系：平台层 JWT + Redis 认证　｜　集群层 Kubernetes RBAC 授权　｜　Namespace 级资源与权限隔离</text>
</svg>
